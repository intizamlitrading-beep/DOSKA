<html lang="kaa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Intizamli Trading — onlayn doska: sızıw, trading qurallari, svechalar, Fibonachchi.">
<meta name="theme-color" content="#f4f4f6">

<title>Intizamli Trading — Doska</title>
<style>
:root{--card:#fff;--ink:#1d1d1f;--line:#e2e2e6;--hov:#eceef2;--sh:0 2px 10px #0003;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#2b2b2f;--ink:#f0f0f2;--line:#45454b;--hov:#3a3a40}}
*{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:#f4f4f6;color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#board{position:fixed;inset:0}
#svg{width:100%;height:100%;display:block;touch-action:none;background:#f4f4f6}
#svg .o *{pointer-events:visiblePainted}
#ta{position:absolute;display:none;border:1px dashed #1c6fe0;background:transparent;resize:none;outline:none;padding:0;margin:0;font-family:system-ui,sans-serif;line-height:1.25;overflow:hidden}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:6px;display:flex;gap:4px;align-items:center}
#left{position:fixed;left:12px;top:68px;display:flex;flex-direction:column;gap:12px;z-index:5}
#tb{flex-direction:column}@media (max-height:720px){#tb button{width:30px;height:30px;font-size:16px}#left{gap:8px}}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;border-radius:50%;width:36px;height:36px;font-size:18px;display:grid;place-items:center;position:relative}
button:hover{background:var(--hov)}
button:focus-visible{outline:2px solid #1c6fe0}
button.on{background:#4a4a4f;color:#fff}
button:disabled{opacity:.35;cursor:default}
hr{width:70%;border:0;border-top:1px solid var(--line);margin:2px 0}
#tb button:hover::after{content:attr(data-tip);color:var(--ink);font-weight:400;position:absolute;left:46px;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;font-size:14px;box-shadow:var(--sh);z-index:9;pointer-events:none}
#pop{position:fixed;left:66px;z-index:8;display:none;max-height:calc(100vh - 16px);overflow-y:auto;overflow-x:hidden}
#pop.v{flex-direction:column}
#pop button.cc{width:24px;height:24px;border:1px solid #0004;margin:2px}
#pop button.cc.on{outline:2px solid #1c6fe0;outline-offset:2px}
#pop button.ww i{display:block;background:currentColor;border-radius:50%}
#pop button.ww.on{background:var(--hov);outline:2px solid #1c6fe0}
#pop .row{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
#pop .menu{display:flex;flex-direction:column;padding:4px 6px}#pop .mc{columns:2;column-gap:10px;min-width:min(460px,calc(100vw - 100px))}#pop .sec{break-inside:avoid}#pop .kb{margin-left:auto;opacity:.6;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px}
#pop .menu h5{margin:10px 8px 4px;font-size:12px;opacity:.6;font-weight:600}
#pop .menu button{width:100%;height:34px;border-radius:8px;justify-content:start;display:flex;align-items:center;gap:12px;padding:0 8px;font-size:14px}
#pop .menu button b{width:22px;text-align:center;font-weight:400;font-size:17px}
#pop .em{display:grid;grid-template-columns:repeat(5,36px)}
#tr{position:fixed;right:12px;top:12px;z-index:5;padding:4px 6px}
#tr .pill{width:auto;border-radius:18px;padding:0 12px;font-size:14px}
#tr .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#more{position:fixed;right:12px;top:62px;z-index:6;display:none;flex-direction:column;align-items:stretch;min-width:190px}
#more button{width:auto;border-radius:8px;justify-content:start;font-size:14px;padding:0 12px;display:flex;align-items:center}
#br{position:fixed;right:12px;bottom:12px;z-index:5}
#zv{width:52px;text-align:center;font-size:15px}
#brand{position:fixed;left:12px;top:12px;z-index:5;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:4px 10px}
#brand img{display:block;height:44px;width:auto}
#ctx{position:fixed;z-index:7;display:none;gap:2px;padding:4px 6px;align-items:center;flex-wrap:nowrap;max-width:calc(100vw - 16px);overflow-x:auto}
#ctx button{width:32px;height:32px;font-size:16px;flex:none}
#ctx button.sw{width:22px;height:22px;border:1px solid #0004;margin:5px 2px}
#ctx button.t{width:auto;border-radius:8px;padding:0 8px;font-size:13px;white-space:nowrap}
#ctx .sp{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
@media (max-width:640px){#brand img{height:30px}}
</style>
</head>
